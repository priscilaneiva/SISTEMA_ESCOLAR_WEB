<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>
</head>
<body>
    <h1>Sistema de Gerenciamento Escolar</h1>

    <h2>Entrar no sistema</h2>
    <form>
        <label>Colaborador:</label><br>
        <input type="text" name="colaborador"/><br><br>
        
        <label>Matrírcula:</label><br>
        <input type="text" name="matricula"/><br><br>

        <label>Senha:</label><br>
        <input type="password" name="senha"/><br><br>

        <input type="submit" value="Entrar"/>
    </form>

    <hr>

    <h2>Cadastro de Aluno</h2>
    <form>
        <label>Nome do Aluno:</label><br>
        <input type="text" name="nomeAluno"/><br><br>

        <label>Matrícula:</label><br>
        <input type="text" name="matricula"/><br><br>

        <label>Data de Nascimento:</label><br>
        <input type="date" name="dataNascimento"/><br><br>

        <label>Série:</label><br>
        <input type="text" name="serie"/><br><br>

        <input type="submit" value="Salvar"/>
    </form>

    <hr>

    <h2>Lista de Alunos</h2>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Série</th>
            <th>Ações</th>
        </tr>

        </tr>
    </table>
</body>
</html>
